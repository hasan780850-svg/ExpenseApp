name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              python3-pip \
              build-essential \
              git \
              ffmpeg \
              libsdl2-dev \
              libsdl2-image-dev \
              libsdl2-mixer-dev \
              libsdl2-ttf-dev \
              libportmidi-dev \
              libswscale-dev \
              libavformat-dev \
              libavcodec-dev \
              zlib1g-dev \
              libgstreamer1.0-dev \
              gstreamer1.0-plugins-base \
              gstreamer1.0-plugins-good \
              openjdk-17-jdk \
              unzip \
              zip \
              autoconf \
              libtool \
              pkg-config \
              cmake \
              libffi-dev \
              libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade cython==0.29.33 buildozer kivy

      - name: Build APK with Buildozer
        run: |
          buildozer init || true
          sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,sqlite3/g' buildozer.spec
          sed -i 's/#icon.filename =/icon.filename = profile.png/g' buildozer.spec
          sed -i 's/#package.name = myapp/package.name = expenseapp/g' buildozer.spec
          sed -i 's/#package.domain = org.test/package.domain = org.expense/g' buildozer.spec
          sed -i 's/#android.api = 33/android.api = 33/g' buildozer.spec
          sed -i 's/#android.sdk = 33/android.sdk = 33/g' buildozer.spec
          
          # محاولة البناء مع وضع التفاصيل الكاملة لمعرفة سبب التوقف بدقة
          for i in {1..3}; do
            yes | buildozer -v --debug android debug && break || echo "Retrying build..."
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
