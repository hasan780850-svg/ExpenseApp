name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy

      - name: Build with Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          
          # إعداد ملف بناء بسيط تلقائياً
          buildozer init || true
          sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,sqlite3/g' buildozer.spec
          sed -i 's/#icon.filename =/icon.filename = profile.png/g' buildozer.spec
          sed -i 's/#package.name = myapp/package.name = expenseapp/g' buildozer.spec
          sed -i 's/#package.domain = org.test/package.domain = org.expense/g' buildozer.spec
          
          # تشغيل البناء
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: package
          path: bin/*.apk
